<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Sobrevivência Zumbi</title>
  <style>
    canvas {
      background: #000;
      display: block;
      margin: auto;
      border: 2px solid #fff;
      cursor: crosshair;
    }
  </style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const player = {
    x: 280,
    y: 180,
    width: 40,
    height: 40,
    color: 'lime',
    life: 3
  };

  const bullets = [];
  const zombies = [];
  const keys = {};

  let score = 0;
  let canShoot = true;
  let difficultyLevel = 0;
  let baseZombieSpeed = 1;
  let spawnInterval = 1200;
  let spawnTimer;

  document.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
  });

  document.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function movePlayer() {
    const speed = 3;

    if (keys['arrowup'] || keys['w']) player.y -= speed;
    if (keys['arrowdown'] || keys['s']) player.y += speed;
    if (keys['arrowleft'] || keys['a']) player.x -= speed;
    if (keys['arrowright'] || keys['d']) player.x += speed;

    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
  }

  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || !canShoot) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const startX = player.x + player.width / 2;
    const startY = player.y + player.height / 2;

    const dx = mouseX - startX;
    const dy = mouseY - startY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const speed = 5;
    const dirX = (dx / dist) * speed;
    const dirY = (dy / dist) * speed;

    bullets.push({
      x: startX,
      y: startY,
      width: 4,
      height: 4,
      vx: dirX,
      vy: dirY
    });

    canShoot = false;
    setTimeout(() => canShoot = true, 200);
  });

  function spawnZombie() {
    let edge = Math.floor(Math.random() * 4);
    let x, y;

    if (edge === 0) { x = Math.random() * canvas.width; y = -40; }
    if (edge === 1) { x = Math.random() * canvas.width; y = canvas.height + 40; }
    if (edge === 2) { x = -40; y = Math.random() * canvas.height; }
    if (edge === 3) { x = canvas.width + 40; y = Math.random() * canvas.height; }

    zombies.push({
      x: x,
      y: y,
      width: 40,
      height: 40,
      speed: baseZombieSpeed + difficultyLevel * 0.2,
      color: 'green'
    });
  }

  function updateDifficulty() {
    difficultyLevel = Math.floor(score / 500);
    const newInterval = Math.max(300, spawnInterval - difficultyLevel * 100);

    clearInterval(spawnTimer);
    spawnTimer = setInterval(spawnZombie, newInterval);
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function drawUI() {
    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    ctx.fillText("Vida: " + player.life, 10, 20);
    ctx.fillText("Pontuação: " + score, 460, 20);
    ctx.fillText("Dificuldade: " + difficultyLevel, 10, 40);
  }

  function draw() {
    movePlayer();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    ctx.fillStyle = 'red';
    bullets.forEach((b, i) => {
      b.x += b.vx;
      b.y += b.vy;
      ctx.fillRect(b.x, b.y, b.width, b.height);

      if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
        bullets.splice(i, 1);
      }
    });

    ctx.fillStyle = 'green';
    zombies.forEach((z, zi) => {
      let dx = (player.x + player.width / 2) - (z.x + z.width / 2);
      let dy = (player.y + player.height / 2) - (z.y + z.height / 2);
      let dist = Math.sqrt(dx * dx + dy * dy);
      let dirX = dx / dist;
      let dirY = dy / dist;

      z.x += dirX * z.speed;
      z.y += dirY * z.speed;
      ctx.fillRect(z.x, z.y, z.width, z.height);

      bullets.forEach((b, bi) => {
        if (isColliding(b, z)) {
          zombies.splice(zi, 1);
          bullets.splice(bi, 1);
          score += 100;
          updateDifficulty();
        }
      });

      if (isColliding(player, z)) {
        zombies.splice(zi, 1);
        player.life -= 1;
        if (player.life <= 0) {
          alert("Você foi devorado! Pontuação final: " + score);
          document.location.reload();
        }
      }
    });

    drawUI();
    requestAnimationFrame(draw);
  }

  spawnTimer = setInterval(spawnZombie, spawnInterval);
  draw();
</script>
</body>
</html>
