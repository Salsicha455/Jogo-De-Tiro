<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Jogo de Sobrevivência Zumbi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud" id="hud">
    Vida: <span id="life">3</span> | 
    Pontuação: <span id="score">0</span> | 
    Dificuldade: <span id="difficulty">0</span>
  </div>

  <div class="message" id="gameOverMessage">
    <div>Você foi devorado!</div>
    <div>Pontuação final: <span id="finalScore">0</span></div>
    <button class="restart-btn" id="restartBtn">Reiniciar</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
